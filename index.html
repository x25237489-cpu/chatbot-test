<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ask Atlantic — Atlantic Coast Tours</title>
  <style>
    :root {
      --bg-color: #0b192c;
      --card-bg: #1e293b;
      --accent-teal: #0ea5e9;
      --accent-emerald: #10b981;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --user-bubble: #0284c7;
      --bot-bubble: #334155;
      --error-bubble: #7f1d1d;
      --error-text: #fca5a5;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-main);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      min-height: 100dvh;
      padding: 0;
    }

    /* Mobile-first full screen container */
    .chat-container {
      width: 100%;
      max-width: 500px;
      height: 100vh;
      height: 100dvh;
      background: linear-gradient(180deg, #0f172a 0%, #1e293b 100%);
      display: flex;
      flex-direction: column;
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.5);
    }

    @media (min-width: 640px) {
      .chat-container {
        height: 90vh;
        border-radius: 16px;
        overflow: hidden;
        border: 1px solid rgba(255, 255, 255, 0.1);
      }
    }

    /* Header */
    header {
      padding: 16px 20px;
      background-color: rgba(15, 23, 42, 0.9);
      backdrop-filter: blur(8px);
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
      display: flex;
      align-items: center;
      gap: 12px;
      z-index: 10;
    }

    .brand-icon {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      background: linear-gradient(135deg, #0ea5e9, #10b981);
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: bold;
      color: white;
      font-size: 1.2rem;
      box-shadow: 0 0 12px rgba(14, 165, 233, 0.4);
    }

    .brand-info h1 {
      font-size: 1.1rem;
      font-weight: 700;
      color: var(--text-main);
    }

    .brand-info p {
      font-size: 0.75rem;
      color: var(--accent-teal);
    }

    /* Chat Messages Area */
    .messages-area {
      flex: 1;
      padding: 16px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 16px;
      scroll-behavior: smooth;
    }

    .message-group {
      display: flex;
      flex-direction: column;
      max-width: 85%;
      animation: fadeIn 0.25s ease-out forwards;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(6px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .message-group.user {
      align-self: flex-end;
      align-items: flex-end;
    }

    .message-group.bot, .message-group.error {
      align-self: flex-start;
      align-items: flex-start;
    }

    .bubble {
      padding: 12px 16px;
      border-radius: 18px;
      font-size: 0.95rem;
      line-height: 1.45;
      word-break: break-word;
      white-space: pre-wrap;
    }

    .user .bubble {
      background-color: var(--user-bubble);
      color: white;
      border-bottom-right-radius: 4px;
    }

    .bot .bubble {
      background-color: var(--bot-bubble);
      color: var(--text-main);
      border-bottom-left-radius: 4px;
      border: 1px solid rgba(255, 255, 255, 0.05);
    }

    .error .bubble {
      background-color: var(--error-bubble);
      color: var(--error-text);
      border-bottom-left-radius: 4px;
      border: 1px solid rgba(239, 68, 68, 0.3);
    }

    .timestamp {
      font-size: 0.7rem;
      color: var(--text-muted);
      margin-top: 4px;
      padding: 0 4px;
    }

    /* Thinking dots */
    .thinking-bubble {
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 12px 18px;
    }

    .dot {
      width: 8px;
      height: 8px;
      background-color: var(--accent-teal);
      border-radius: 50%;
      animation: bounce 1.4s infinite ease-in-out both;
    }

    .dot:nth-child(1) { animation-delay: -0.32s; }
    .dot:nth-child(2) { animation-delay: -0.16s; }

    @keyframes bounce {
      0%, 80%, 100% { transform: scale(0); }
      40% { transform: scale(1); }
    }

    /* Input Footer */
    footer {
      padding: 12px 16px;
      background-color: rgba(15, 23, 42, 0.95);
      border-top: 1px solid rgba(255, 255, 255, 0.08);
    }

    .input-form {
      display: flex;
      gap: 8px;
      align-items: center;
    }

    input[type="text"] {
      flex: 1;
      background-color: #0f172a;
      border: 1px solid #334155;
      border-radius: 24px;
      padding: 12px 18px;
      color: var(--text-main);
      font-size: 0.95rem;
      outline: none;
      transition: border-color 0.2s ease;
    }

    input[type="text"]:focus {
      border-color: var(--accent-teal);
    }

    input[type="text"]::placeholder {
      color: #64748b;
    }

    button {
      background: linear-gradient(135deg, #0ea5e9, #0284c7);
      color: white;
      border: none;
      border-radius: 24px;
      padding: 12px 20px;
      font-weight: 600;
      font-size: 0.95rem;
      cursor: pointer;
      transition: opacity 0.2s ease, transform 0.1s ease;
    }

    button:hover {
      opacity: 0.9;
    }

    button:active {
      transform: scale(0.97);
    }

    button:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }
  </style>
</head>
<body>

  <div class="chat-container">
    <header>
      <div class="brand-icon">🌊</div>
      <div class="brand-info">
        <h1>Ask Atlantic</h1>
        <p>Atlantic Coast Tours • Wild Atlantic Way</p>
      </div>
    </header>

    <div class="messages-area" id="messages">
      <div class="message-group bot">
        <div class="bubble">Fáilte! I'm Ask Atlantic. Ask me anything about our tours along the west coast of Ireland.</div>
      </div>
    </div>

    <footer>
      <form class="input-form" id="chat-form">
        <input 
          type="text" 
          id="user-input" 
          placeholder="Ask about tours, prices, or availability..." 
          autocomplete="off" 
          required
        />
        <button type="submit" id="send-btn">Send</button>
      </form>
    </footer>
  </div>

  <script>
    const CSV_URL = "https://docs.google.com/spreadsheets/d/1balBGf8QhZ5dc-RCCAPt2kcrcf6m_YRh0HL_r8bBtJw/export?format=csv";
    const API_URL = "https://luas-class.kluxy.app/chat";
    const SYSTEM_PROMPT = "You are Ask Atlantic, the customer assistant for Atlantic Coast Tours. Answer only from the live data you are given. Quote exact prices in euro and slots left. If something is not in the data, say so. If a value looks implausible, say so and suggest the customer checks with staff. Be warm and brief.";

    const messagesArea = document.getElementById("messages");
    const chatForm = document.getElementById("chat-form");
    const userInput = document.getElementById("user-input");
    const sendBtn = document.getElementById("send-btn");

    chatForm.addEventListener("submit", async (e) => {
      e.preventDefault();
      const question = userInput.value.trim();
      if (!question) return;

      // Append User Bubble
      appendMessage("user", question);
      userInput.value = "";
      setLoading(true);

      // Append Thinking Bubble
      const thinkingGroup = appendThinking();
      scrollToBottom();

      try {
        // 1. Fetch live CSV
        const csvResponse = await fetch(CSV_URL);
        if (!csvResponse.ok) {
          throw new Error(`Failed to load tour data (HTTP ${csvResponse.status})`);
        }
        const csvText = await csvResponse.text();

        // Timestamp of live fetch
        const now = new Date();
        const fetchTime = now.toLocaleTimeString('en-GB', { hour12: false });

        // 2. Send request to class brain
        const brainResponse = await fetch(API_URL, {
          method: "POST",
          headers: {
            "Content-Type": "application/json"
          },
          body: JSON.stringify({
            system: SYSTEM_PROMPT,
            messages: [
              {
                role: "user",
                content: "Live data (CSV):\n" + csvText + "\n\nCustomer question: " + question
              }
            ]
          })
        });

        if (!brainResponse.ok) {
          throw new Error(`Brain request failed (HTTP ${brainResponse.status})`);
        }

        const data = await brainResponse.json();
        const replyText = data.reply || "Sorry, I couldn't generate a reply.";

        // Remove Thinking Bubble
        thinkingGroup.remove();

        // 3. Show reply bubble with live fetch timestamp
        appendMessage("bot", replyText, `Data fetched live at ${fetchTime}`);

      } catch (err) {
        if (thinkingGroup) thinkingGroup.remove();
        appendMessage("error", `Error: ${err.message || err}`);
      } finally {
        setLoading(false);
        scrollToBottom();
      }
    });

    function appendMessage(role, text, timestampText = null) {
      const group = document.createElement("div");
      group.className = `message-group ${role}`;

      const bubble = document.createElement("div");
      bubble.className = "bubble";
      bubble.textContent = text;
      group.appendChild(bubble);

      if (timestampText) {
        const timeEl = document.createElement("div");
        timeEl.className = "timestamp";
        timeEl.textContent = timestampText;
        group.appendChild(timeEl);
      }

      messagesArea.appendChild(group);
      scrollToBottom();
      return group;
    }

    function appendThinking() {
      const group = document.createElement("div");
      group.className = "message-group bot";

      const bubble = document.createElement("div");
      bubble.className = "bubble thinking-bubble";
      
      const dot1 = document.createElement("div");
      dot1.className = "dot";
      const dot2 = document.createElement("div");
      dot2.className = "dot";
      const dot3 = document.createElement("div");
      dot3.className = "dot";

      bubble.appendChild(dot1);
      bubble.appendChild(dot2);
      bubble.appendChild(dot3);

      group.appendChild(bubble);
      messagesArea.appendChild(group);
      return group;
    }

    function setLoading(isLoading) {
      userInput.disabled = isLoading;
      sendBtn.disabled = isLoading;
      if (!isLoading) {
        userInput.focus();
      }
    }

    function scrollToBottom() {
      messagesArea.scrollTop = messagesArea.scrollHeight;
    }
  </script>
</body>
</html>
